<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari</title>
  </head>
  <body>
    <script>
      var hari = prompt("masukan kode hari 1 s/d 7");
      switch (hari) {
        case "1":
          document.write("senin");
          break;
        case "2":
          document.write("selasa");
          break;
        case "3":
          document.write("rabu");
          break;
        case "4":
          document.write("kamis");
          break;
        case "5":
          document.write("jumat");
          break;
        case "6":
          document.write("sabtu");
          break;
        case "7":
          document.write("minggu");
          break;
        default:
          document.write("Kode salah");
          break;
      }
    </script>
  </body>
</html>
